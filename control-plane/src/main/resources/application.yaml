spring:
  application:
    name: suru-control-plane
  datasource:
    url: ${SURU_DB_URL:jdbc:postgresql://localhost:5432/suru}
    username: ${SURU_DB_USER:suru}
    password: ${SURU_DB_PASSWORD:suru_dev_only}
    hikari:
      maximum-pool-size: 16
      # A read API that cannot get a connection should say so quickly rather than hold the
      # request thread until something else times out.
      connection-timeout: 3000
  # The schema is applied by the storage module as a deployment step, not by every API instance
  # on startup — several restarting at once would otherwise race to migrate the same database.
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri rather than jwk-set-uri: it makes the resource server fetch the provider's
          # discovery document and then *validate the iss claim* against it. Configuring the key
          # set alone verifies that a token was signed by the right key while accepting any issuer
          # that key ever signed for, which is a real difference in a shared Keycloak.
          issuer-uri: ${SURU_OIDC_ISSUER:http://localhost:8081/realms/suru}

server:
  port: ${SURU_API_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    io.github.mustaffadnc.suru: INFO
