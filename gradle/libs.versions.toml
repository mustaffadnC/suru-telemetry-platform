# Central version catalogue. Every new dependency is declared here;
# module build files never spell out a bare version.

[versions]
java = "25"

# phase 2 — ingest gateway
netty = "4.2.16.Final"
kafka = "4.3.1"
micrometer = "1.17.0"
# Lettuce was declared for a Redis-backed duplicate filter and removed again: per-message Redis
# costs a network round trip on a path doing 1.44M frames/s, and cross-instance deduplication
# belongs in phase 4's stream processor where the state is already keyed by device. ADR-0004.
# slf4j 2.1.x and logback 1.6.x are paired, but 2.1.x is still alpha — Maven Central's
# <release> field reports the alpha, so it is pinned deliberately to the stable pair.
slf4j = "2.0.18"
logback = "1.5.38"

# phase 3 — control plane
springBoot = "4.1.0"
springdoc = "3.1.0"

# phase 3 — storage
flyway = "13.1.0"
postgresql = "42.7.13"
hikari = "7.1.0"

# test
junit = "6.0.3"
assertj = "3.27.3"
testcontainers = "2.0.5"
awaitility = "4.3.0"
# 1.4.1 is the first release whose bundled ASM understands Java 25 class files
# (major version 69). On 1.4.0 the importer silently skips every class and each
# rule fails with "failed to check any classes" — which reads like a rule
# violation but is really a parser that read nothing.
archunit = "1.4.2"

# jqwik was considered for property-based testing and not adopted: it targets JUnit
# Platform 1.x and this project is on Platform 6. The properties it would have covered
# — a parser that never throws on arbitrary input, always resyncs, and agrees with
# itself under every input chunking — are expressed with JUnit and RandomGenerator
# instead, in HkDecoderTest and MavlinkDecoderTest. Revisit if a jqwik release targets
# Platform 6.
# Phase 2+: netty, kafka, spring-boot, testcontainers.

[libraries]
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport" }
netty-handler = { module = "io.netty:netty-handler" }
netty-buffer = { module = "io.netty:netty-buffer" }

kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
# Flyway 10+ moved per-database support into separate artifacts; without this one it
# refuses to run against PostgreSQL at all.
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

micrometer-bom = { module = "io.micrometer:micrometer-bom", version.ref = "micrometer" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testcontainers' JUnit extension is deliberately NOT used: like archunit-junit5 it binds
# to the JUnit Platform version, and this project is on Platform 6. Containers are started
# and stopped from @BeforeAll/@AfterAll against the core API instead.
#
# Note the module names: Testcontainers 2.x renamed every module to a "testcontainers-"
# prefix. The old coordinates (org.testcontainers:kafka) stop at 1.21.4, and asking the 2.x
# BOM for them fails with "Could not find org.testcontainers:kafka:" — no version, because
# the BOM manages the new name only.
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
# No QuestDB client dependency. Its line protocol is plain text over a TCP socket, so the
# comparison writes it directly — org.questdb:questdb ships the server and carries no Sender,
# and org.questdb:questdb-client is a stale 1.x artifact that does not track the server.

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
# The core ArchUnit API is used rather than the archunit-junit5 engine: the engine is
# tightly coupled to the JUnit Platform version, the core API is not.
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }

[bundles]
testing = ["junit-jupiter", "assertj-core", "archunit"]
